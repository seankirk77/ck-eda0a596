<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f6f5f2"><title>Checklist</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#e6e4df;--acc:#4f46e5;--do:#4f46e5;--done:#16a34a;--drop:#8e8e93;--rec:#fff7e6;--recl:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c1f;--ink:#f2f2f4;--mute:#9a9aa1;--line:#2c2c31;--rec:#2a2418;--recl:#e0b45c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 110px}
header h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px}header p{margin:0 0 18px;color:var(--mute);font-size:14px}
.test{background:#fde68a;color:#000;padding:6px 10px;border-radius:8px;margin-bottom:12px;font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.t{font-weight:650;font-size:16px;letter-spacing:-.01em;display:flex;gap:8px}.n{color:var(--mute);font-weight:500;min-width:18px}
.s{color:var(--mute);margin:4px 0 8px;font-size:14px}
.r{background:var(--rec);border-radius:10px;padding:7px 10px;font-size:13.5px;margin-bottom:10px}.r b{color:var(--recl)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);font:600 13px/1 inherit;padding:8px 13px;border-radius:999px;cursor:pointer;position:relative}
.seg button.rec:not(.on){box-shadow:inset 0 0 0 1.5px var(--recl)}
.seg button.on{color:#fff}.seg button.on[data-v=do]{background:var(--do)}.seg button.on[data-v=done]{background:var(--done)}.seg button.on[data-v=drop]{background:var(--drop)}
.nb{border:0;background:none;color:var(--acc);font:500 13px inherit;padding:6px 4px;cursor:pointer}
textarea{display:none;width:100%;margin-top:8px;min-height:60px;font:16px/1.4 inherit;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 10px;resize:vertical}
.card.open textarea{display:block}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}#cnt{flex:1;font-size:14px;color:var(--mute)}#msg{font-size:13px;font-weight:600}
#go{border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:600 15px inherit;padding:11px 22px}#go:disabled{opacity:.5}
.legend{font-size:12px;color:var(--mute);margin:-8px 0 14px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--recl);vertical-align:-1px;margin-right:4px}
</style></head><body><div class="wrap">
<header><h1 id="h">Loading…</h1><p>These are your open asks. Tap <b>Do it</b>, <b>Done</b> or <b>Drop</b> on each one, add a note if you want, then hit Submit and Rosey takes it from there.</p></header>
<div class="legend"><i></i>An outlined button is Rosey's recommendation.</div>
<div id="tb"></div><div id="list"></div></div>
<div class="bar"><div class="in"><div id="cnt">0 chosen</div><div id="msg"></div><button id="go" hidden>Submit</button></div></div>
<script>
const ENDPOINT='https://pqnlmtbliezpjibvtlat.supabase.co/functions/v1/checklist-submit';
const q=new URLSearchParams(location.search),isTest=q.get('test')==='1';
let listId='',title='Checklist',items=[];
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');return decodeURIComponent(escape(atob(s)))}
function upd(){const c=document.querySelectorAll('.seg button.on').length;document.getElementById('cnt').textContent=c+' of '+items.length+' chosen'}
async function load(){
 if(q.get('data')){const d=JSON.parse(b64(q.get('data')));listId=d.id||'inline';title=d.title||title;items=d.items}
 else if(q.get('items')){items=q.get('items').split('|');listId=q.get('id')||'inline';title=q.get('title')||title}
 else{const l=q.get('list')||'2026-10-12';const u=/^https:/.test(l)?l:'lists/'+encodeURIComponent(l)+'.json';
  const d=await (await fetch(u,{cache:'no-store'})).json();listId=d.id||l;title=d.title||title;items=d.items}
 items=items.map(x=>typeof x==='string'?{text:x}:x);if(q.get('only'))items=items.slice(0,+q.get('only'));
 document.title=title;document.getElementById('h').textContent=(isTest?'TEST — ':'')+title;
 if(isTest)document.getElementById('tb').innerHTML='<div class="test">TEST MODE — submission will be marked TEST</div>';
 const L=document.getElementById('list');
 items.forEach((it,i)=>{const r=document.createElement('div');r.className='card row-item';r.innerHTML=
  `<div class="t"><span class="n">${i+1}</span><span class="tt"></span></div><div class="s"></div><div class="r"><b>Rosey recommends:</b> <span></span></div>
  <div class="row"><div class="seg"><button data-v="do">Do it</button><button data-v="done">Done</button><button data-v="drop">Drop</button></div><button class="nb">+ Note</button></div><textarea placeholder="Note for Rosey"></textarea>`;
  r.querySelector('.tt').textContent=it.text;
  const s=r.querySelector('.s');if(it.summary)s.textContent=it.summary;else s.remove();
  const rc=r.querySelector('.r');if(it.rec)rc.querySelector('span').textContent=it.rec;else rc.remove();
  if(it.rec_status){const b=r.querySelector(`.seg button[data-v=${it.rec_status}]`);if(b)b.classList.add('rec')}
  r.querySelector('.nb').onclick=e=>{r.classList.toggle('open');e.target.textContent=r.classList.contains('open')?'− Note':'+ Note';if(r.classList.contains('open'))r.querySelector('textarea').focus()};
  r.querySelectorAll('.seg button').forEach(bt=>bt.onclick=()=>{const on=bt.classList.contains('on');r.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));if(!on)bt.classList.add('on');upd()});
  L.appendChild(r)});
 upd();document.getElementById('go').hidden=false}
document.getElementById('go').onclick=async()=>{
 const rows=[...document.querySelectorAll('.row-item')],m=document.getElementById('msg'),g=document.getElementById('go');
 const body={list_id:listId,title:(isTest?'TEST — ':'')+title,test:isTest,submitted_at:new Date().toISOString(),
  items:rows.map((r,i)=>({n:i+1,text:items[i].text,status:(r.querySelector('.seg button.on')||{}).dataset?.v||null,note:r.querySelector('textarea').value.trim()}))};
 g.disabled=true;m.textContent='Sending…';
 try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();
  if(!r.ok)throw Error(j.error||r.status);m.textContent=(/^HTTP 2/.test(j.rosey_webhook)?'✅ Sent to Rosey':'✅ Saved')+' (#'+j.id+')'}catch(e){m.textContent='❌ '+e.message+' — retry';g.disabled=false}};
load().catch(e=>document.getElementById('h').textContent='Could not load list: '+e.message);
</script></body></html>
